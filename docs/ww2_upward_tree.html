function assertTree(){const seen=new Set(),walking=new Set(),unitDirect={};for(const n of nodes){if(seen.has(n.id))throw Error('중복 노드 '+n.id);seen.add(n.id);for(const p of n.req||[]){if(!byId[p])throw Error('없는 선행 '+p);const t=byId[p].type+'>'+n.type;if(!['building>research','research>research','research>building','research>unit'].includes(t))throw Error('허용되지 않은 연결 '+t);if(n.type==='unit'){unitDirect[p]=(unitDirect[p]||0)+1}}if(n.type==='unit'&&(!(n.req||[]).length||n.req.some(p=>byId[p].type!=='research')))throw Error('유닛 선행 연구 오류 '+n.id)}for(const [k,v]of Object.entries(unitDirect))if(v>1)throw Error('연구 하나에 여러 유닛 '+k);function visit(id){if(walking.has(id))throw Error('순환 연결 '+id);if(!seen.has(id))throw Error('잘못된 id');if(visited.has(id))return;walking.add(id);for(const p of byId[id].req||[])visit(p);walking.delete(id);visited.add(id)}const visited=new Set();for(const n of nodes)visit(n.id);for(const n of nodes.filter(x=>x.type==='research'))if((unitDirect[n.id]||0)!==1)throw Error('유닛을 열지 않는 연구 '+n.id);
for(const n of nodes.filter(x=>x.type==='unit'))if(!STATS[n.id])throw Error('능력치 없는 유닛 '+n.id);
for(const research of nodes.filter(x=>x.type==='research'))for(const prevId of research.req||[]){
if(byId[prevId].type!=='research')continue;
const prevUnit=nodes.find(x=>x.type==='unit'&&(x.req||[]).includes(prevId));
const unit=nodes.find(x=>x.type==='unit'&&(x.req||[]).includes(research.id));
const p=PROGRESSION[unit.id];
if(!p||p.from!==prevUnit.id)throw Error('연구 연결에 성장 정의가 없음: '+research.id);
if(STATS[unit.id].dmg[p.focus]<=STATS[prevUnit.id].dmg[p.focus])throw Error('상위 기술 강점 미흡: '+research.id);
if(p.kind==='상위'&&STATS[unit.id].hp<=STATS[prevUnit.id].hp)throw Error('상위 기술 체력 미흡: '+research.id);
}
return true}
// 화력은 상대적인 전투 성능입니다. 보병 / 전차 / 진지 / 항공기 순서입니다.
// 생산비, 연구비, 체력, 이동성 모두 임시 밸런스 수치이며 실제 전투 시뮬레이션은 아닙니다.
const STATS={
 rifle:    {hp:60,range:2,mobility:3,dmg:[15,1,3,0]},
 mg:       {hp:65,range:3,mobility:1,dmg:[38,2,8,0]},
 mortar:   {hp:45,range:4,mobility:1,dmg:[28,4,42,0]},
 gun:      {hp:60,range:6,mobility:1,dmg:[36,28,78,0]},
 at:       {hp:50,range:2,mobility:2,dmg:[8,60,8,0]},
 car:      {hp:110,range:2,mobility:5,dmg:[52,16,12,0]},
 tank:     {hp:230,range:4,mobility:3,dmg:[85,68,52,0]},
 heavy:    {hp:420,range:4,mobility:2,dmg:[116,108,86,0]},
 destroyer:{hp:220,range:5,mobility:2,dmg:[28,145,36,0]},
 fighter:  {hp:120,range:4,mobility:5,dmg:[3,2,4,120]},
 attacker: {hp:125,range:3,mobility:4,dmg:[55,85,50,18]},
 bomber:   {hp:155,range:5,mobility:2,dmg:[110,40,140,6]}
};
const TARGETS=['보병','전차','진지','항공기'];
const PROGRESSION={
 gun:{from:'mortar',kind:'상위',focus:2,note:'진지 화력과 사거리 상승'},
 tank:{from:'car',kind:'상위',focus:1,note:'장갑과 범용 전투력이 상승'},
 heavy:{from:'tank',kind:'상위',focus:1,note:'더 높은 화력과 체력, 대신 느리고 비쌈'},
 destroyer:{from:'tank',kind:'특화',focus:1,note:'전차 공격 특화. 보병 대응력은 감소'},
 bomber:{from:'attacker',kind:'특화',focus:2,note:'진지와 밀집 보병에 강함. 대전차 정밀공격은 감소'}
};
const enemyLabel=['보병','전차','진지','항공기'];
function effective(n){const base=STATS[n.id];if(!base)return null;const u=state.upgrades[n.id]||{};const atk=1+.18*(u.power||0),hp=1+.20*(u.survive||0);return {hp:Math.round(base.hp*hp),range:base.range,mobility:base.mobility,dmg:base.dmg.map(v=>Math.round(v*atk))}}
function comparisonFor(id){const p=PROGRESSION[id];if(!p)return '';const prev=byId[p.from],n=byId[id],a=STATS[prev.id],b=STATS[n.id],idx=p.focus;const efficiency=v=>(100*v.dmg[idx]/byId[v===a?prev.id:n.id].cost).toFixed(1);return `<div class="infobox compareBox"><h3>${p.kind} 성장 비교 · ${prev.name} → ${n.name}</h3><div class="compareNote">${p.note}</div><table class="compareTable"><thead><tr><th>항목</th><th>${prev.name}</th><th>${n.name}</th></tr></thead><tbody><tr><td>${TARGETS[idx]} 상대 화력</td><td>${a.dmg[idx]}</td><td><strong>${b.dmg[idx]}</strong></td></tr><tr><td>체력</td><td>${a.hp}</td><td><strong>${b.hp}</strong></td></tr><tr><td>생산비</td><td>${prev.cost}</td><td>${n.cost}</td></tr><tr><td>${TARGETS[idx]} 화력 / 100물자</td><td>${efficiency(a)}</td><td>${efficiency(b)}</td></tr></tbody></table><div class="muted">기본 유닛 1개 기준. 연구비와 강화는 별도이므로 최적 빌드는 달라질 수 있습니다.</div></div>`}
function statPanel(n){const s=effective(n),b=STATS[n.id];if(!s)return '';const max=150;return `<div class="infobox statsBox"><h3>전투 성능 <span class="statNote">현재 강화 반영</span></h3><div class="condition"><span>체력</span><b>${s.hp}${s.hp===b.hp?'':` (+${s.hp-b.hp})`}</b></div><div class="condition"><span>사거리</span><b>${s.range} / 6</b></div><div class="condition"><span>이동성</span><b>${s.mobility} / 5</b></div><h3 class="statSub">상대별 화력</h3>${s.dmg.map((d,i)=>`<div class="statRow"><span>${TARGETS[i]}</span><div class="statTrack"><div class="statFill" style="width:${Math.min(100,d/max*100)}%"></div></div><b>${d}</b></div>`).join('')}<div class="muted">화력 수치는 병과별 상대 성능을 나타낸 임시값입니다. 실제 전투 DPS나 승률을 의미하지 않습니다.</div></div>`}
function researchPreview(r){const unit=nodes.find(n=>n.type==='unit'&&(n.req||[]).includes(r.id));if(!unit)return '';const s=STATS[unit.id];if(!s)return '';return `<div class="infobox"><h3>연구 결과 · ${unit.name} 생산 가능</h3><div class="condition"><span>생산비</span><b>${unit.cost} 물자</b></div><div class="condition"><span>체력 / 사거리</span><b>${s.hp} / ${s.range}</b></div><div class="condition"><span>강점</span><b>${TARGETS[s.dmg.indexOf(Math.max(...s.dmg))]} 상대 화력 ${Math.max(...s.dmg)}</b></div><div class="muted">연구비와 생산비는 별도입니다. 연구 완료 후 유닛을 생산할 수 있습니다.</div></div>`}
function done(n){return n.type==='research'?state.research.includes(n.id):n.type==='building'?state.built.includes(n.id):(state.counts[n.id]||0)>0}
function unlocked(n){return (n.req||[]).every(p=>done(byId[p]))}
function available(n){return unlocked(n)&&(n.type!=='unit'||state.built.includes(n.producer))}
function costUpgrade(n,key){const lv=state.upgrades[n.id]?.[key]||0;return Math.round(n.cost*(lv===0?.55:.8)/5)*5}
function addHistory(){history.push(JSON.parse(JSON.stringify(state)));if(history.length>35)history.shift()}
function spendOn(n){if(!available(n)|| (n.type!=='unit'&&done(n)) ||state.budget<(n.cost||0))return toast('먼저 필요한 건물과 연구를 확인하세요.');addHistory();state.budget-=n.cost||0;if(n.type==='building')state.built.push(n.id);else if(n.type==='research')state.research.push(n.id);else state.counts[n.id]=(state.counts[n.id]||0)+1;save();render()}
function buyUpgrade(n,key){if(!available(n))return;const v=state.upgrades[n.id]||{},lv=v[key]||0,c=costUpgrade(n,key);if(lv>=2||state.budget<c)return;addHistory();state.budget-=c;state.upgrades[n.id]={...v,[key]:lv+1};save();render()}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function status(n){return done(n)?'완료':available(n)?'선택 가능':'잠김'}
function nodeHtml(n){let meta=n.type==='unit'?(state.counts[n.id]||0)+'개 생산':done(n)?'보유':(n.cost||0)+' 물자';if(n.type==='research'&&done(n))meta='연구 완료';if(n.type==='unit'&&done(n))meta=(state.counts[n.id]||0)+'개 편성';const disabled=!available(n);return `<span class="kind">${names[n.type]}</span><div class="name">${n.name}</div><div class="meta"><span>${meta}</span><b>${done(n)?'✓':disabled?'잠김':'○'}</b></div>`}
function drawNodes(){const layer=document.getElementById('nodeLayer');for(const n of nodes){const el=document.createElement('button');el.className='node '+n.type+(n.id==='hq'?' hq':'');el.id='n-'+n.id;el.style.cssText=`left:${n.x}px;top:${n.y}px;`;el.onclick=()=>{selected=n.id;save();render()};layer.appendChild(el)}}
function points(a,b){
  const sx=a.x+NW/2,tx=b.x+NW/2;
  const fromTop=a.y,toBottom=b.y+NH;
  if(b.type==='unit'){
    return `M${sx} ${fromTop} C${sx} ${fromTop-56},${tx} ${toBottom+56},${tx} ${toBottom}`;
  }
  if(a.type==='building'){
    const mid=1050;
    return `M${sx} ${fromTop} V${mid} H${tx} V${toBottom}`;
  }
  // Deeper research branches sideways from the parent to avoid its unit leaf.
  const edgeX=a.x+NW-8,edgeY=a.y+32;
  return `M${edgeX} ${edgeY} C${edgeX+105} ${edgeY-46},${tx+18} ${toBottom+115},${tx} ${toBottom}`;
}
function drawWires(){
 const edges=[];
 // Organizational root lines: not unlock dependencies. The building-to-building
 // constraint is unchanged; these lines represent the HQ's three facility families.
 const hq=byId.hq,roots=['barracks','factory','airfield'].map(k=>byId[k]);
 const hx=hq.x+NW/2,splitY=1294;
 edges.push(`<path class="wire rootTrunk" d="M${hx} ${hq.y} V${splitY} H${roots[0].x+NW/2} M${hx} ${splitY} H${roots[2].x+NW/2}"/>`);
 for(const n of roots)edges.push(`<path class="wire rootBranch" d="M${n.x+NW/2} ${splitY} V${n.y+NH}"/>`);
 for(const n of nodes)for(const p of n.req||[]){
  const a=byId[p];const edgeClass=n.type==='unit'?'toUnit':a.type==='research'?'toResearch':'';
  edges.push(`<path class="wire ${edgeClass} ${done(a)?'active':''}" d="${points(a,n)}"/>`);
 }
 document.getElementById('wires').innerHTML=edges.join('');
}
function renderNodes(){for(const n of nodes){const el=document.getElementById('n-'+n.id);el.innerHTML=nodeHtml(n);el.className='node '+n.type+(n.id==='hq'?' hq':'')+(done(n)?' done':'')+(!available(n)?' locked':'')+(selected===n.id?' chosen':'');el.setAttribute('aria-label',names[n.type]+' '+n.name+', '+status(n))}}
function detail(){const el=document.getElementById('details'),n=byId[selected];const m=missions.find(x=>x.id===state.mission);let html=`<div class="eyebrow">${names[n.type]} · ${status(n)}</div><h2>${n.name}</h2><p>${n.desc||n.role}</p>`;
if(n.id==='hq'){
html+=`<div class="missionHint"><b>이번 작전: ${m.name}</b><div>${m.note}</div></div><div class="infobox"><h3>알아둘 규칙</h3><div class="condition"><span>소총병 + 병영</span><b>병영에서 시작</b></div><div class="condition"><span>공장 / 비행장</span><b>바로 건설 가능</b></div><div class="condition"><span>각 연구가 여는 유닛</span><b>정확히 1종</b></div><div class="condition"><span>군수물자</span><b>작전마다 고정</b></div></div><div class="tipList"><div class="tip"><strong>보병을 많이 상대한다면</strong>기관총을 먼저 확보하거나 소총병을 강화하세요. 같은 100 물자라도 적 종류에 따라 효율이 다릅니다.</div><div class="tip"><strong>전차가 걱정된다면</strong>대전차병을 확보하거나 장갑차 → 중형전차를 연구하세요. 상위 유닛은 한 대의 화력과 체력이 올라갑니다.</div><div class="tip"><strong>적 진지가 문제라면</strong>박격포 → 야포로 발전시키세요. 야포는 더 비싸지만 사거리와 진지 화력이 높습니다.</div></div>`;
}else{
const req=n.req||[];if(req.length)html+=`<div class="infobox"><h3>필요한 것</h3>${req.map(id=>`<div class="condition"><span>${byId[id].name}</span><b>${done(byId[id])?'✓ 완료':'아직 없음'}</b></div>`).join('')}${n.type==='unit'?`<div class="condition"><span>생산 시설: ${byId[n.producer].name}</span><b>${state.built.includes(n.producer)?'✓ 보유':'아직 없음'}</b></div>`:''}</div>`;
if(n.type==='building'||n.type==='research'){
const t=n.type==='building'?'건설':'연구';if(!done(n))html+=`<div class="infobox"><h3>${t} 비용</h3><div class="condition"><span>군수물자</span><b>${n.cost||0}</b></div><button class="cta" id="pay" ${!available(n)||state.budget<(n.cost||0)?'disabled':''}>${available(n)?t+'하기':'선행 조건 필요'}</button></div>`;
else html+=`<div class="infobox"><h3>완료되었습니다</h3><div class="muted">${n.type==='building'?'이 시설에서 관련 무기를 연구할 수 있습니다.':'연결된 유닛을 생산할 수 있습니다.'}</div></div>`;
if(n.type==='research'){html+=researchPreview(n);const unit=nodes.find(x=>x.type==='unit'&&(x.req||[]).includes(n.id));if(unit)html+=comparisonFor(unit.id)}
}else{
const count=state.counts[n.id]||0,ok=available(n);html+=`<div class="infobox"><h3>생산과 강화</h3><div class="condition"><span>현재 수량</span><b>${count}개 부대</b></div><button class="cta" id="pay" ${!ok||state.budget<n.cost?'disabled':''}>1개 생산 · ${n.cost} 물자</button></div><div class="infobox"><h3>${n.name} 전체 강화</h3>`;
for(const [key,label,eff] of [['power','화력','공격 성능'],['survive','생존력','방어 성능']]){const lv=state.upgrades[n.id]?.[key]||0,c=costUpgrade(n,key);html+=`<div class="unitUp"><div><span>${label} ${lv}/2</span><small>${eff} 향상 · 같은 유닛 모두 적용</small></div><button data-up="${key}" ${!ok||lv>=2||state.budget<c?'disabled':''}>${lv===2?'최대 강화':c+' 물자'}</button></div>`}html+='</div>';html+=statPanel(n);html+=comparisonFor(n.id);
}
const c=nodes.filter(x=>(x.req||[]).includes(n.id));if(c.length)html+=`<div class="infobox"><h3>다음에 열리는 것</h3>${c.map(x=>`<div class="condition"><span>${x.name}</span><b>${names[x.type]}</b></div>`).join('')}</div>`;
}
html+=`<div class="sidefooter">상위 유닛은 1개 기준 성능이 높아집니다. 그러나 연구비·생산비·강화비를 모두 고려해야 합니다. 시간만 지나서는 기술이 열리지 않습니다.</div>`;el.innerHTML=html;el.querySelector('#pay')?.addEventListener('click',()=>spendOn(n));el.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>buyUpgrade(n,b.dataset.up)))}
function render(){const m=missions.find(x=>x.id===state.mission);document.getElementById('budget').textContent=state.budget.toLocaleString('ko-KR');document.getElementById('mission').value=state.mission;document.getElementById('missionHint').textContent=m.note;document.getElementById('undo').disabled=!history.length;renderNodes();drawWires();detail()}
function setZoom(z){zoom=Math.max(.44,Math.min(1.15,Math.round(z*100)/100));document.getElementById('world').style.setProperty('--zoom',zoom);document.getElementById('space').style.cssText=`width:${W*zoom}px;height:${H*zoom}px`;document.getElementById('zoomText').textContent=Math.round(zoom*100)+'%'}
function centerOn(id){const n=byId[id],sc=document.getElementById('scroll');const left=(n.x+NW/2)*zoom-sc.clientWidth/2,top=(n.y+NH/2)*zoom-sc.clientHeight/2;sc.scrollLeft=Math.max(0,left);sc.scrollTop=Math.max(0,top)}
function autoFit(){const sc=document.getElementById('scroll');const z=Math.min(1,(sc.clientWidth-18)/W);setZoom(z);sc.scrollTop=Math.max(0,sc.scrollHeight-sc.clientHeight);sc.scrollLeft=0}
function reset(id=state.mission){state=fresh(id);history=[];selected='hq';save();render()}
assertTree();load();drawNodes();setZoom(zoom);render();centerOn('hq');
const sel=document.getElementById('mission');sel.innerHTML=missions.map(m=>`<option value="${m.id}">${m.name} · ${m.budget} 물자</option>`).join('');render();
sel.onchange=e=>reset(e.target.value);document.getElementById('reset').onclick=()=>reset();document.getElementById('undo').onclick=()=>{if(!history.length)return;state=history.pop();save();render()};document.getElementById('zmin').onclick=()=>setZoom(zoom+.1);document.getElementById('zmout').onclick=()=>setZoom(zoom-.1);document.getElementById('fit').onclick=autoFit;document.getElementById('goRoot').onclick=()=>centerOn('hq');
window.treeTest=()=>({layout:'bottom-up',root:'hq',rootChildren:['barracks','factory','airfield'],nodesLayout:Object.fromEntries(nodes.map(n=>[n.id,{x:n.x,y:n.y,req:n.req||[],type:n.type}])),stats:JSON.parse(JSON.stringify(STATS)),progression:JSON.parse(JSON.stringify(PROGRESSION)),effective:Object.fromEntries(nodes.filter(n=>n.type==='unit').map(n=>[n.id,effective(n)])),nodeCount:nodes.length,unitCount:nodes.filter(n=>n.type==='unit').length,researchCount:nodes.filter(n=>n.type==='research').length,buildingCount:nodes.filter(n=>n.type==='building').length,researchEdges:nodes.filter(n=>n.type==='research').reduce((sum,n)=>sum+(n.req||[]).filter(p=>byId[p].type==='research').length,0),researchWithoutUnit:nodes.filter(n=>n.type==='research'&&!nodes.some(c=>c.type==='unit'&&(c.req||[]).includes(n.id))).map(n=>n.id),budget:state.budget,mission:state.mission,built:[...state.built],research:[...state.research],counts:{...state.counts},upgrades:JSON.parse(JSON.stringify(state.upgrades)),validate:assertTree()});
})();
